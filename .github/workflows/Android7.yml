name: Android7

on:
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/actions/configuring-and-managing-workflows/configuring-a-workflow#configuring-a-build-matrix
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@main
      with:
         submodules: true

    - name: Setup Android NDK modified(export NDK_HOME)
      uses: HoshinoSuzumi/setup-ndk@v1.5.4
      with:
        ndk-version: r26d
        local-cache: true # optional, default is false
          
    - name: Configure CMake and Build
      env:
        ANDROID_NDK_LATEST_HOME: /home/runner/.setup-ndk/r26d
      run: |
           bash android_ci_build.bash

    - name: Upload build output
      uses: actions/upload-artifact@main
      with:
        name: MG
        path: |
              build/*.so
